[package]
name = "kservice_printer_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "kservice_printer_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
handlebars = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
escpos = { version = "=0.17.0", features = ["usb", "serial_port", "graphics", "codes_2d", "barcodes"] }
hex = "0.4"
unicode-width = "0.2"
encoding_rs = "0.8"
image = "=0.25.8"
cosmic-text = "=0.16.0"
base64 = "0.22"
rusb = "0.9"
