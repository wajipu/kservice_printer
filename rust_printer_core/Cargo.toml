[package]
name = "kservice_printer_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "kservice_printer_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
handlebars = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex = "0.4"
unicode-width = "0.2"
encoding_rs = "0.8"
image = "=0.25.8"
cosmic-text = "=0.16.0"
base64 = "0.22"
qrcode = "0.14"

[target.'cfg(not(target_os = "windows"))'.dependencies]
escpos = { version = "=0.17.0", features = ["usb", "serial_port", "graphics", "codes_2d", "barcodes"] }
rusb = { version = "0.9", features = ["vendored"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mdns-sd = { version = "0.20", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
escpos = { version = "=0.17.0", features = ["serial_port", "graphics", "codes_2d", "barcodes"] }
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }
