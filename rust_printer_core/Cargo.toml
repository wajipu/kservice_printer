[package]
name = "kservice_printer_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "kservice_printer_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
handlebars = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
escpos = { version = "0.18", features = ["native_usb", "serial_port"] }
hex = "0.4"
