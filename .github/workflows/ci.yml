name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FLUTTER_CHANNEL: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Rust versions
        run: rustc --version && cargo --version

      - name: Rust test
        run: cargo test --manifest-path rust_printer_core/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path rust_printer_core/Cargo.toml --all-targets -- -D warnings

      - name: Dart analyze
        run: flutter analyze 2>&1 | tee /tmp/flutter_analyze.log

      - name: Dart test
        run: flutter test 2>&1 | tee /tmp/flutter_test.log

      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            /tmp/flutter_analyze.log
            /tmp/flutter_test.log

  build-android:
    name: Build Android APK
    needs: lint-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install example deps
        working-directory: example
        run: flutter pub get

      - name: Build debug APK
        working-directory: example
        run: flutter build apk --debug

  build-linux:
    name: Build Linux
    needs: lint-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev libudev-dev libusb-1.0-0-dev ninja-build pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install example deps
        working-directory: example
        run: flutter pub get

      - name: Build Linux example
        working-directory: example
        run: flutter build linux --debug

  build-macos:
    name: Build macOS
    needs: lint-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS deps
        run: |
          brew install libusb pkg-config
          brew link libusb || true
          echo "PKG_CONFIG_PATH=$(brew --prefix libusb)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install example deps
        working-directory: example
        run: flutter pub get

      - name: Build macOS example
        working-directory: example
        run: flutter build macos --debug

  build-windows:
    name: Build Windows
    needs: lint-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install example deps
        working-directory: example
        run: flutter pub get

      - name: Build Windows example
        working-directory: example
        run: flutter build windows --debug
