name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dart cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Rust check & clippy
        run: |
          cargo clippy --manifest-path rust_printer_core/Cargo.toml -- -D warnings
          cargo test --manifest-path rust_printer_core/Cargo.toml

      - name: Dart analyze
        run: flutter analyze --verbose

      - name: Dart test
        run: flutter test --verbose

  build-linux:
    name: Build Linux
    needs: lint-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libgtk-3-dev liblzma-dev

      - name: Install Rust (Linux targets)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install example deps
        working-directory: example
        run: flutter pub get

      - name: Build example (Linux)
        working-directory: example
        run: flutter build linux --release

  build-macos:
    name: Build macOS
    needs: lint-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (macOS targets)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install example deps
        working-directory: example
        run: flutter pub get

      - name: Build example (macOS)
        working-directory: example
        run: flutter build macos --release

  build-windows:
    name: Build Windows
    needs: lint-test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (Windows targets)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install example deps
        working-directory: example
        run: flutter pub get

      - name: Build example (Windows)
        working-directory: example
        run: flutter build windows --release

  build-android:
    name: Build Android
    needs: lint-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install example deps
        working-directory: example
        run: flutter pub get

      - name: Build example (Android APK)
        working-directory: example
        run: flutter build apk --release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
