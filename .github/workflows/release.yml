name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.1
        required: true
        default: v0.0.1
      release_name:
        description: Optional release title
        required: false
        default: ""
      draft:
        description: Create or update as draft
        required: true
        type: boolean
        default: false
      prerelease:
        description: Mark as prerelease
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FLUTTER_CHANNEL: stable

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp example/build/app/outputs/flutter-apk/app-release.apk dist/kservice_printer_example-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev libudev-dev libusb-1.0-0-dev ninja-build pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build Linux bundle
        working-directory: example
        run: |
          flutter pub get
          flutter build linux --release

      - name: Collect artifact
        run: |
          mkdir -p dist
          tar -czf dist/kservice_printer_example-linux-x64.tar.gz -C example/build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS deps
        run: |
          brew install libusb pkg-config
          brew link libusb || true
          echo "PKG_CONFIG_PATH=$(brew --prefix libusb)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build macOS app
        working-directory: example
        run: |
          flutter pub get
          flutter build macos --release

      - name: Collect artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            example/build/macos/Build/Products/Release/kservice_printer_example.app \
            dist/kservice_printer_example-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_printer_core

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build Windows app
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --release

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path example/build/windows/x64/runner/Release/* -DestinationPath dist/kservice_printer_example-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build-android
      - build-linux
      - build-macos
      - build-windows
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      RELEASE_NAME: ${{ inputs.release_name }}
      RELEASE_DRAFT: ${{ inputs.draft || false }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          set -euo pipefail
          title="$RELEASE_NAME"
          if [ -z "$title" ]; then
            title="$RELEASE_TAG"
          fi

          flags=()
          if [ "$RELEASE_DRAFT" = "true" ]; then
            flags+=(--draft)
          fi
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes \
              "${flags[@]}"
          fi
